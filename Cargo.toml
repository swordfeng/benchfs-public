[workspace]
members = [
    "crates/benchfs-sdk",
    "crates/benchfs-fuse",
    "crates/benchfs-nullfs",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
doc_markdown = "allow"
module_name_repetitions = "allow"
