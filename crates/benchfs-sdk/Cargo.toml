[package]
name = "benchfs-sdk"
version = "0.1.0"
description = "Normative Rust contract for BenchFS v1 filesystem implementations"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"

[dependencies]
async-trait = "0.1"
compio = { version = "0.19.1", default-features = false, features = ["fs", "io", "runtime", "io-uring"] }
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
futures = "0.3"
